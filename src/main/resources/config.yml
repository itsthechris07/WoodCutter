############################################################
# +------------------------------------------------------+ #
# |                     - Config -                       | #
# |               Plugin by Christian34                  | #
# +------------------------------------------------------+ #
############################################################
# the texts of the plugin are in messages.yml (or messages_<language>.yml)

config:
  # the language of the texts: en (messages.yml), de, fr, es, pl, zh, ru, uk, cs or pt (messages_<language>.yml)
  language: en
  # worlds without WoodCutter - * stands for any characters, so sg_* matches sg_1, sg_lobby, ...
  disabled-worlds:
    - Lobby
    - example2
    - sg_*
    - ctb_*
  # level of the enchanting table offer that can give the enchantment
  level: 30
  # chance in percent to get the enchantment with such an offer (100 = always)
  chance: 40
  # Limit the number of blocks to be destroyed (with level I of the enchantment)
  # ranks can get a higher limit with the permission woodcutter.maxblocks.<amount> (e.g. woodcutter.maxblocks.300)
  maxblocks: 120
  # the enchantment has levels (WoodCutter I, II, III), higher ones cut bigger trees
  # the enchanting table gives level I (60 %), II (30 %) or III (10 %), two items of the same level are
  # combined to the next one in an anvil, a grindstone removes the enchantment
  levels:
    # 1 disables the levels
    max: 3
    # blocks every level adds to 'maxblocks'
    additional-blocks: 60
  # false: logs that were placed by players are never cut, so buildings next to trees are safe
  destroy-fake-trees: false
  # true: logs without leaves are no tree and not cut - this also keeps buildings that are older than the plugin
  # (the trees of the Nether need their wart blocks instead)
  require-leaves: true
  # huge mushrooms are cut like trees when their stem is broken with an axe
  mushrooms: true
  # logs that are never cut, by name or a pattern - * stands for any characters, e.g. stripped_* for all stripped
  # logs (which are mostly built by players) or cherry_log
  excluded-logs: []
  # blocks that are cut like logs, besides the logs of Minecraft - e.g. the logs of mods on hybrid servers, by name
  # or a pattern (* stands for any characters)
  extra-logs: []
  # blocks that are removed with the leaves of a cut tree, besides the leaves of Minecraft, e.g. nether_wart_block
  extra-leaves: []
  # blocks on the logs of a tree that are removed with it, their items drop (and vines below them as well)
  attached-blocks:
    - cocoa
    - vine
    - shelf_mushroom
  # saplings of logs that have none in Minecraft (or another one), as 'log: sapling', e.g.
  # saplings:
  #   my_log: my_sapling
  saplings: {}
  # items of other plugins that are axes for WoodCutter (they cut trees and get the enchantment):
  # itemsadder:<namespace>:<id>, nexo:<id>, oraxen:<id> or mmoitems:<type>:<id> - or items of Minecraft, e.g. mace
  custom-axes:
    items: []
    # true: only these items are axes for WoodCutter, not the axes of Minecraft
    only: false
  # bee nests in a cut tree fall with it
  bees:
    # the bees fly out and attack the player who cut the tree
    angry: true
    # the nest drops as an item (without its bees)
    drop-nest: false
  # needs WorldGuard: regions by their id (* stands for any characters), __global__ is everywhere outside of regions
  # blacklist: WoodCutter is disabled in the listed regions, whitelist: it is only enabled in them
  # (the region flag 'woodcutter' works as well: /rg flag <region> woodcutter deny)
  worldguard-regions:
    mode: blacklist
    list: []
  # if true player must sit to use woodcutter
  require-sneaking: true
  delay:
    enabled: true
    # seconds - players with the permission woodcutter.bypass.delay (e.g. a rank) have no delay,
    # woodcutter.delay.<seconds> (e.g. woodcutter.delay.10) gives a rank a shorter one
    time: 30
    # message over action bar / set to >message: ''< to disable the message
    message: '&cYou can use WoodCutter again in %time% seconds.'
  # WoodCutter as a goodie: who cuts trees with every axe, without the enchantment
  # none: nobody, the enchantment is required
  # permission: players with the permission woodcutter.goodie (e.g. a rank or a reward)
  # everyone: all players
  goodie: none
  # the tree does not just disappear, its leaves follow from the bottom to the top (with 'fast-leaf-decay')
  animation:
    enabled: true
    # layers: the tree is cut log by log from the bottom to the top
    # topple: the tree is cut at once and tips over, away from the player
    mode: layers
    # logs per tick with the mode 'layers' (20 ticks are a second)
    blocks-per-tick: 2
    # with the mode 'topple':
    topple:
      # how the tree falls:
      # simple: it tips over at an even pace and disappears on the ground
      # rigid: it falls faster and faster, stops at what it hits (hills, walls, other trees), bounces and slides
      # fall-apart: like rigid, but it breaks into its logs when it hits the ground, which tumble apart
      physics: rigid
      # where the tree falls to:
      # away: away from the player, facing: where the player looks, slope: down the hill (or where there is the most
      # room), random: anywhere
      direction: away
      # the tree floats on water instead of sinking (with the physics rigid and fall-apart)
      float-on-water: true
      # ticks between two positions of the falling tree sent to the players (1 is the smoothest, higher values send
      # less to the players of big servers - they still see a smooth movement)
      update-interval: 2
      # the falling tree glows in this color, e.g. '#7cfc00' ('' disables it)
      glow: ''
      # the items drop where the tree hits the ground instead of where it stood (not with 'drops-to-inventory')
      drops-where-it-lands: true
      # mobs and players the tree falls on are pushed away
      knockback: true
      # damage the tree does to the mobs and players it falls on, as the player who cut it (2 = a heart, 0 disables it)
      damage: 0
      # shows "Timber!" (message 'timber') as a subtitle to the player who cut the tree
      timber: false
  # sounds and particles of the animations
  effects:
    # sounds as 'sound volume pitch', e.g. 'minecraft:block.wood.break 1 0.8' - all sounds of a list play together,
    # [] plays none (the names of the sounds: https://minecraft.wiki/w/Sounds.json)
    sounds:
      # a log of the tree is cut (the mode 'layers'), the pitch rises towards the top of the tree
      chop:
        - 'minecraft:block.wood.break 1 0.7'
      # the tree starts to fall (the mode 'topple')
      creak:
        - 'minecraft:block.wooden_door.open 1.5 0.5'
        - 'minecraft:block.wood.break 1.5 0.6'
      # the tree hits the ground
      impact:
        - 'minecraft:block.wood.break 2 0.5'
        - 'minecraft:entity.generic.big_fall 1.5 0.6'
      # the tree falls into water
      splash:
        - 'minecraft:entity.generic.splash 1.5 0.8'
      # the leaves of the tree decay
      leaves:
        - 'minecraft:block.grass.break 0.6 1'
    particles:
      # leaves fall from the crown of a falling tree
      falling-leaves: true
      # dust and splinters where the tree hits the ground
      impact: true
      # the leaves of the tree burst when they decay
      leaves: true
  # bigger trees take longer to chop: the log a player breaks to cut a tree breaks slower, a bar shows the progress
  chopping:
    # percent every log of the tree makes breaking the log slower, e.g. 5: a tree of 20 logs takes twice as long
    # (0 disables it)
    slowdown-per-log: 0
    # the most breaking the log can take, in times as long as a single log
    max-factor: 6
    # how the progress is shown: bossbar, actionbar or none
    progress: bossbar
  # the leaves of a cut tree decay within seconds
  fast-leaf-decay: true
  # plants a new sapling when the lowest log of a tree is broken - four of them for trees with a trunk of 2x2 logs
  replant:
    enabled: true
    # false: the sapling is taken from the inventory of the player, nothing is planted without one
    free: false
    # players can't break the planted saplings until they grow (players with woodcutter.replant.break can)
    protect: false
  # logs (and their bonus drops) are put into the inventory of the player instead of dropped
  drops-to-inventory: false
  bonus-drops:
    # chance in percent that a log of a cut tree drops a second time (0 disables it)
    chance: 0
  # what cutting a tree costs (0 disables it) - players in creative mode pay nothing
  costs:
    # food points (10 fill the whole bar), players with less can't cut trees
    hunger: 0
    # experience levels, players with less can't cut trees
    experience: 0
    # money of an economy plugin (Vault and e.g. EssentialsX), players with less can't cut trees
    money: 0
  # needs Vault and an economy plugin (e.g. EssentialsX)
  economy:
    # money players get for every log of a cut tree, e.g. 0.5 (0 disables it) - not in creative mode
    reward-per-log: 0
  # the tree is only cut as far as the axe lasts: cutting stops before the hit that would break it
  protect-axe: true
  experience-drops:
    # experience points every log of a cut tree drops, e.g. 0.5 for a point every two logs (0 disables it)
    # with 'drops-to-inventory' the player gets them directly
    per-log: 0.25
  # the woodcutting skill: players gain experience for every log of a tree they cut and reach levels with perks
  # /woodcutter level shows the level and the perks of a player, /woodcutter top the best players
  skill:
    enabled: true
    max-level: 50
    # experience for every log of a cut tree
    xp-per-log: 1
    # experience for the first level, every further level needs 'xp-increase' more than the one before
    # (with 1 xp per log: level 1 after about 20 oaks, level 10 after 3000 logs, level 50 after 55000 logs)
    xp-first-level: 120
    xp-increase: 40
    # what players get at the highest level - the perks grow evenly with every level (0 disables a perk)
    perks:
      # additional logs per tick of the animation
      speed: 4
      # seconds the delay between two trees is shorter
      delay: 20
      # additional logs on top of 'maxblocks'
      max-blocks: 120
      # chance in percent on top of 'bonus-drops'
      bonus-drops: 20
      # chance in percent that a log of a tree does not damage the axe
      axe-saver: 30
      # percent the costs of a tree are lower
      costs: 50
      # chance in percent that a decaying leaf of a cut tree drops one of the 'lucky-drops'
      forester-luck: 3
    # what leaves drop with 'forester-luck' - item:weight, items with a higher weight drop more often
    # 'sapling' is the sapling of the cut tree
    lucky-drops:
      - stick:40
      - sapling:35
      - apple:25
    # levels that unlock features for a player, even if they are disabled above (0: never)
    unlocks:
      # a new sapling is planted for free
      replant: 10
      # logs are put into the inventory
      drops-to-inventory: 20
    # commands the server runs when a player reaches a level, as 'level: command' - %player% is the name of the
    # player, %uuid% their id and %level% the level, e.g.
    # rewards:
    #   - '10: give %player% golden_apple 3'
    #   - '25: eco give %player% 500'
    #   - '50: lp user %player% parent add forester'
    rewards: []
  # other ways to get a book with WoodCutter than the enchanting table (0 disables one)
  sources:
    # chance in percent that a new trade of a librarian is such a book
    librarian: 3
    # chance in percent that a trade of a wandering trader is such a book
    wandering-trader: 3
    # emeralds a book costs (with a normal book) for every level of the enchantment
    price: 20
    # chance in percent that a chest with loot (dungeons, mineshafts, villages, ...) contains such a book
    loot: 3
