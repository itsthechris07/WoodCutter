  skill_info_max: '%prefix%&9%player% &8| &7Level &9%level% &8(&7max&8) | &f%xp% XP'
  skill_perk_speed: ' &8- &7Faster cutting: &f+%value% logs per tick'
  skill_perk_delay: ' &8- &7Shorter delay: &f-%value% seconds'
  skill_perk_max_blocks: ' &8- &7Bigger trees: &f+%value% logs'
  skill_perk_bonus_drops: ' &8- &7Bonus drops: &f+%value% %'
