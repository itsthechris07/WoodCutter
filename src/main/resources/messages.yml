  menu_reset_click: '&7Click to reset'
  menu_reset_confirm: '&cClick again to reset'
  menu_reset_none: '&7All settings have their default values'
  menu_back: '&7Back'
  # shown as a subtitle when a tree tips over (animation 'topple', with animation.topple.timber: true in the config)
  timber: '&6&lTimber!'
  # money for a cut tree (economy.reward-per-log) - e.g. '%prefix%&a+%money% &7for %logs% logs'
  economy_reward: ''
  # shown over the action bar
  not_enough_money: '&cYou need %money% to cut a whole tree.'
  skill_trees: ' &8- &7Trees cut: &f%trees%'
  # the bar while a bigger tree is chopped (setting 'chopping')
  chopping: '&6Chopping the tree &8(&f%logs% logs&8)'
  # shown over the action bar
  sapling_protected: "&cThis sapling was planted by WoodCutter and can't be broken until it grows."
